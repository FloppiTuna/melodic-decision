services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-melodic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourPassw0rdh3re}
      POSTGRES_DB: ${POSTGRES_DB:-melodic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-melodic} -d ${POSTGRES_DB:-melodic}"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  melodic:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-melodic}:${POSTGRES_PASSWORD:-yourPassw0rdh3re}@db:5432/${POSTGRES_DB:-melodic}
    volumes:
      - uploads_data:/usr/src/app/static/uploads
      - likenesses_data:/usr/src/app/static/likenesses
    depends_on:
      db:
        condition: service_healthy
    # For a host directory instead of a Docker volume:
    # volumes:
    #   - ./static/uploads:/usr/src/app/static/uploads
    #   - ./static/likenesses:/usr/src/app/static/likenesses

volumes:
  postgres_data:
  uploads_data:
  likenesses_data:
